<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="results-body">

    <div class="results-wrapper">
        <div class="results-panel">

            <div class="results-top-row">
                <h2 class="results-title">
                    Results for: <span id="search-query"></span>
                </h2>

                <div class="mini-search-box" style="display: flex; gap: 8px; margin-right: auto; margin-left: 20px;">
                    <input type="text" id="mini-search-input" placeholder="Search anime..."
                        style="padding: 6px 12px; border-radius: 20px; border: none; outline: none;">
                    <button onclick="miniSearch()"
                        style="padding: 6px 12px; border-radius: 20px; border: none; background: #2563eb; color: white; cursor: pointer;">🔍</button>
                </div>

                <div class="results-actions">
                    <button onclick="window.history.back()" class="top-link-btn" style="background: #4b5563;">⬅
                        Back</button>

                    <button id="btn-suggest" class="btn-want">Smart Recommendations</button>
                    <a href="want.html" class="top-link-btn">Want</a>
                    <a href="watched.html" class="top-link-btn">Watched</a>
                </div>
            </div>

            <div id="anime-grid"></div>

        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script type="module" src="../js/script.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        document.getElementById('search-query').textContent = query;
    </script>
    <script>
        function miniSearch() {
            const input = document.getElementById('mini-search-input').value.trim();
            if (input === "") return;

            // Instantly redirects them to a fresh search!
            window.location.href = `results.html?q=${encodeURIComponent(input)}`;
        }

        // Allows the user to press 'Enter' to search instead of clicking the icon
        const searchInput = document.getElementById('mini-search-input');
        if (searchInput) {
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') miniSearch();
            });
        }
    </script>
</body>

</html>
