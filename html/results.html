<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="results-body">

    <div class="results-wrapper">
        <div class="results-panel">

            <div class="results-top-row">
                <div class="results-left">
                    <h2 class="results-title">
                        Results for: <span id="search-query"></span>
                    </h2>
                </div>

                <div class="results-center">
                    <div class="mini-search-box">
                        <input type="text" id="mini-search-input" placeholder="Search anime...">
                        <button onclick="miniSearch()">search</button>
                    </div>
                </div>

                <div class="results-right">
                    <div class="top-actions-row">
                        <button id="btn-suggest" class="primary-action-btn">Smart Recommendations</button>
                    </div>

    <!-- SECOND ROW -->
    <div class="list-actions-row">
    <button id="title-toggle-btn" class="top-link-btn toggle-btn">JP</button>
    <a href="want.html" class="top-link-btn">Want</a>
    <a href="watched.html" class="top-link-btn">Watched</a>
</div>

</div>
</div>

            <div id="anime-grid"></div>

            <div class="pagination-controls" id="pagination-controls" style="display: none;">
                <button id="prev-page-btn" class="primary-action-btn back-btn" disabled>« Previous</button>
                <span id="page-indicator">Page 1</span>
                <button id="next-page-btn" class="primary-action-btn">Next »</button>
            </div>

        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script type="module" src="../js/script.js"></script>

    <script>
        // 1. Set the search query text on load
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        if (query) {
            document.getElementById('search-query').textContent = query;
        }

        // 2. Mini Search Logic
        function miniSearch() {
            const input = document.getElementById('mini-search-input').value.trim();
            if (input === "") return;
            // Instantly redirects them to a fresh search
            window.location.href = `results.html?q=${encodeURIComponent(input)}`;
        }

        // 3. Allow 'Enter' key for mini search
        const searchInput = document.getElementById('mini-search-input');
        if (searchInput) {
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') miniSearch();
            });
        }
    </script>
</body>

</html>
