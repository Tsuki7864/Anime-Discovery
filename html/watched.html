<!-- watched.html-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watched</title>
  <link rel="icon" type="image/png" href="../images/favicon.png" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/results.css" />
  <link rel="stylesheet" href="../css/cards.css" />
</head>

<body class="results-body">

  <div class="layout-container">
    <div class="results-panel">
      <div class="results-top-row">
        <h2 class="results-title">Watched</h2>

        <div class="mini-search-box" style="display: flex; gap: 8px; margin-right: auto; margin-left: 20px;">
          <input type="text" id="mini-search-input" placeholder="Search anime..."
            style="padding: 6px 12px; border-radius: 20px; border: none; outline: none;">
          <button onclick="miniSearch()"
            style="padding: 6px 12px; border-radius: 20px; border: none; background: #2563eb; color: white; cursor: pointer;">search</button>
        </div>

        <div class="results-actions">
          <a href="results.html" class="top-link-btn back-btn">⬅ Back</a>
          <button id="btn-suggest" class="primary-action-btn">Smart Recommendations</button>
          <a href="want.html" class="top-link-btn">Want to Watch</a>
          <a href="watched.html" class="top-link-btn" style="opacity: 0.5; pointer-events: none;">Watched</a>
        </div>
      </div>

      <div id="anime-grid"></div>
    </div>
  </div>
  <aside class="sidebar-panel">
    <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; color: white;">
      🔥 Trending Now
    </h3>
    <div id="trending-container">
      <p style="color: #666; font-size: 0.9rem; font-style: italic;">Fetching API data...</p>
    </div>
  </aside>
  </div>
  <script>
    function miniSearch() {
      const input = document.getElementById('mini-search-input').value.trim();
      if (input === "") return;
      window.location.href = `results.html?q=${encodeURIComponent(input)}`;
    }

    const searchInput = document.getElementById('mini-search-input');
    if (searchInput) {
      searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') miniSearch();
      });
    }
  </script>
  <script type="module">
    import { renderAnimeCards } from '../js/ui.js';

    // 1. Grab the list from local storage
    let wantList = JSON.parse(localStorage.getItem("watchedList")) || [];

    // 2. Format the flattened data so ui.js can read the image URL perfectly
    function getFormattedList() {
      return wantList.map(anime => ({
        ...anime,
        images: { jpg: { image_url: anime.image } }
      }));
    }

    // 3. Draw the cards using ui.js! 
    renderAnimeCards(getFormattedList(), '#anime-grid', true);
  </script>
</body>
