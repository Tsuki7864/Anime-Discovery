<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Want to Watch</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="results-body">

  <div class="results-wrapper">
    <div class="results-panel">
      <div class="results-top-row">
        <h2 class="results-title">Want to Watch</h2>

        <div class="mini-search-box" style="display: flex; gap: 8px; margin-right: auto; margin-left: 20px;">
          <input type="text" id="mini-search-input" placeholder="Search anime..."
            style="padding: 6px 12px; border-radius: 20px; border: none; outline: none;">
          <button onclick="miniSearch()"
            style="padding: 6px 12px; border-radius: 20px; border: none; background: #2563eb; color: white; cursor: pointer;">search</button>
        </div>

        <div class="results-actions">
          <a href="../index.html" class="top-link-btn back-btn">⬅ Back</a>
          <button id="btn-suggest" class="primary-action-btn">Smart Recommendations</button>
          <a href="watched.html" class="top-link-btn">Watched</a>
          <a href="want.html" class="top-link-btn" style="opacity: 0.5; pointer-events: none;">Want to Watch</a>
        </div>
      </div>

      <div id="anime-grid"></div>
    </div>
  </div>
  <script>
    function miniSearch() {
      const input = document.getElementById('mini-search-input').value.trim();
      if (input === "") return;
      window.location.href = `results.html?q=${encodeURIComponent(input)}`;
    }

    const searchInput = document.getElementById('mini-search-input');
    if (searchInput) {
      searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') miniSearch();
      });
    }
  </script>
  <script type="module">
    import { renderAnimeCards } from '../js/ui.js';

    // 1. Grab the list from local storage
    let wantList = JSON.parse(localStorage.getItem("wantList")) || [];

    // 2. Format the flattened data so ui.js can read the image URL perfectly
    function getFormattedList() {
      return wantList.map(anime => ({
        ...anime,
        images: { jpg: { image_url: anime.image } } // Re-creates the API structure
      }));
    }

    // 3. Draw the cards using ui.js! (The 'true' tells it to use List Mode)
    renderAnimeCards(getFormattedList(), '#anime-grid', true);

    // 4. Handle the Remove Button clicks
    document.querySelector('#anime-grid').addEventListener('click', (event) => {
      const removeBtn = event.target.closest('.remove-btn');
      if (!removeBtn) return;

      const rawId = removeBtn.dataset.id;
      const title = removeBtn.dataset.title;

      wantList = wantList.filter(anime => {
        const animeId = anime.mal_id ?? anime.malId ?? "";
        if (rawId && animeId !== "") {
          return String(animeId) !== String(rawId);
        }
        return anime.title !== title;
      });

      localStorage.setItem("wantList", JSON.stringify(wantList));
      renderAnimeCards(getFormattedList(), '#anime-grid', true);
    });
  </script>

</body>

</html>
